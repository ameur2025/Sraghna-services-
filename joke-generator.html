<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .joke-text {
            font-size: 1.3em;
            color: #333;
            font-weight: 500;
            line-height: 1.6;
        }

        .joke-setup {
            font-size: 1.2em;
            color: #444;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .joke-punchline {
            font-size: 1.1em;
            color: #667eea;
            margin-top: 15px;
            font-style: italic;
            border-top: 2px solid rgba(102, 126, 234, 0.3);
            padding-top: 15px;
        }

        .loading {
            display: none;
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 200px;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
            min-width: 200px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-3px);
        }

        .joke-category {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .category-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .category-value {
            color: #666;
            font-size: 1.1em;
            margin-top: 5px;
        }

        .error-message {
            display: none;
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #e74c3c;
        }

        .counter {
            font-size: 0.9em;
            color: #999;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .joke-text {
                font-size: 1.1em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh every time!</p>

        <div class="error-message" id="errorMessage"></div>

        <div class="joke-box" id="jokeBox">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading a funny joke...</p>
            </div>
            <div class="joke-text" id="jokeText" style="display: none;">
                Click "Get Joke" to start!
            </div>
        </div>

        <div class="joke-category" id="categoryBox" style="display: none;">
            <div class="category-label">Category:</div>
            <div class="category-value" id="category"></div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="getJoke()">🎲 Get Joke</button>
            <button class="btn-secondary" onclick="copyJoke()">📋 Copy</button>
        </div>

        <div class="counter">
            <span id="jokeCount">0</span> jokes loaded
        </div>
    </div>

    <script>
        let currentJoke = '';
        let jokeCount = 0;

        async function getJoke() {
            const jokeBox = document.getElementById('jokeBox');
            const jokeText = document.getElementById('jokeText');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const categoryBox = document.getElementById('categoryBox');

            // Show loading state
            loading.style.display = 'block';
            jokeText.style.display = 'none';
            categoryBox.style.display = 'none';
            errorMessage.style.display = 'none';

            try {
                // Fetch from Official Joke API
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Build the joke content
                let jokeContent = '';
                if (data.type === 'general') {
                    jokeContent = `
                        <div class="joke-setup">${data.setup}</div>
                        <div class="joke-punchline">${data.punchline}</div>
                    `;
                    currentJoke = `${data.setup}\n${data.punchline}`;
                } else {
                    jokeContent = `<div class="joke-text">${data.joke}</div>`;
                    currentJoke = data.joke;
                }

                // Update category
                const category = document.getElementById('category');
                category.textContent = data.category.toUpperCase();
                categoryBox.style.display = 'block';

                // Update joke display
                jokeText.innerHTML = jokeContent;
                jokeText.style.display = 'block';
                loading.style.display = 'none';

                // Increment counter
                jokeCount++;
                document.getElementById('jokeCount').textContent = jokeCount;

            } catch (error) {
                console.error('Error:', error);
                loading.style.display = 'none';
                errorMessage.style.display = 'block';
                errorMessage.textContent = '❌ Oops! Could not load joke. Please try again.';
                jokeText.style.display = 'none';
                categoryBox.style.display = 'none';
            }
        }

        function copyJoke() {
            if (currentJoke) {
                navigator.clipboard.writeText(currentJoke).then(() => {
                    // Show feedback
                    const btn = event.target;
                    const originalText = btn.textContent;
                    btn.textContent = '✅ Copied!';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    alert('Failed to copy joke');
                });
            } else {
                alert('No joke to copy. Get a joke first!');
            }
        }

        // Load a joke when page loads
        window.addEventListener('load', () => {
            getJoke();
        });

        // Allow Enter key to get new joke
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                getJoke();
            }
        });
    </script>
</body>
</html>
